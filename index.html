    <!-- =====================================================

    <script
        src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
        defer>
    </script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;

<body>


<div class="container">

    <div class="card">


        <!-- Notification icon -->

        <div class="notification-icon">
            🔔
        </div>


        <h1>
            Stay Updated
        </h1>


        <p class="description">

            Enable notifications on this device
            to receive important updates and
            messages directly in your browser.

        </p>


        <!-- Notification button -->

        <button
            id="notifyButton"
            type="button"
            disabled>

            Loading...

        </button>


        <!-- Status -->

        <div id="status">

            <span class="loading"></span>
            Initializing notifications...

        </div>


        <!-- Device ID -->

        <div
            class="device-box"
            id="deviceBox">

            <div class="device-title">
                OneSignal Subscription ID
            </div>

            <div id="deviceId"></div>

            <button
                id="copyButton"
                type="button">

                📋 Copy Device ID

            </button>

        </div>


    </div>


    <div class="footer">

        Secure browser notifications powered by OneSignal

    </div>

</div>



<script>

    /*
    ==========================================================
        CONFIGURATION
    ==========================================================
    */

    const ONESIGNAL_APP_ID =
        "7171c1c5-1f40-4c60-b965-00ff2d3b2b0f";


    /*
    ==========================================================
        ELEMENTS
    ==========================================================
    */

    const button =
        document.getElementById("notifyButton");

    const status =
        document.getElementById("status");

    const deviceBox =
        document.getElementById("deviceBox");

    const deviceIdElement =
        document.getElementById("deviceId");

    const copyButton =
        document.getElementById("copyButton");


    let currentDeviceId = null;


    /*
    ==========================================================
        ONESIGNAL
    ==========================================================
    */

    window.OneSignalDeferred =
        window.OneSignalDeferred || [];


    OneSignalDeferred.push(
        async function(OneSignal) {

            try {

                /*
                Initialize OneSignal
                */

                await OneSignal.init({

                    appId:
                        ONESIGNAL_APP_ID

                });


                console.log(
                    "OneSignal initialized successfully"
                );


                /*
                Enable button
                */

                button.disabled = false;

                button.innerHTML =
                    "🔔 Allow Notifications";


                /*
                Check current subscription
                */

                await checkSubscription(
                    OneSignal
                );


            }

            catch(error) {

                console.error(
                    "OneSignal initialization error:",
                    error
                );


                button.disabled = true;

                button.innerHTML =
                    "Notifications Unavailable";


                status.innerHTML =
                    "❌ OneSignal could not initialize.<br>" +
                    "<small>" +
                    escapeHtml(
                        error.message || error
                    ) +
                    "</small>";

            }

        }
    );



    /*
    ==========================================================
        CHECK SUBSCRIPTION
    ==========================================================
    */

    async function checkSubscription(
        OneSignal
    ) {

        try {

            const subscription =
                OneSignal.User.PushSubscription;


            console.log(
                "Current subscription:",
                subscription
            );


            if (
                subscription &&
                subscription.optedIn &&
                subscription.id
            ) {

                showDevice(
                    subscription.id
                );


                status.innerHTML =
                    "✅ Notifications are already enabled.";


                button.innerHTML =
                    "✅ Notifications Enabled";


                button.disabled = true;


                return;

            }


            /*
            Not subscribed yet
            */

            status.innerHTML =
                "Click the button below to enable notifications.";


        }

        catch(error) {

            console.error(
                "Subscription check error:",
                error
            );

            status.innerHTML =
                "Click below to enable notifications.";

        }

    }



    /*
    ==========================================================
        REQUEST NOTIFICATION PERMISSION
    ==========================================================
    */

    button.addEventListener(
        "click",
        async function() {

            /*
            Prevent multiple clicks
            */

            button.disabled = true;

            button.innerHTML =
                '<span class="loading"></span>' +
                'Requesting permission...';


            status.innerText =
                "Please allow notifications when your browser asks.";


            try {

                /*
                Request browser permission
                */

                await OneSignal.Notifications
                    .requestPermission();


                console.log(
                    "Notification permission requested"
                );


                /*
                Give OneSignal a moment to
                create the subscription
                */

                await wait(1500);


                /*
                Get subscription
                */

                const subscription =
                    OneSignal.User.PushSubscription;


                console.log(
                    "Subscription after permission:",
                    subscription
                );


                if (
                    subscription &&
                    subscription.optedIn &&
                    subscription.id
                ) {

                    /*
                    SUCCESS
                    */

                    showDevice(
                        subscription.id
                    );


                    status.innerHTML =
                        "✅ Notifications are enabled on this device.";


                    button.innerHTML =
                        "✅ Notifications Enabled";


                    button.disabled = true;


                    /*
                    This is the ID you can save
                    in Supabase later.
                    */

                    console.log(
                        "DEVICE / SUBSCRIPTION ID:",
                        subscription.id
                    );


                    /*
                    Example:

                    sendDeviceToServer(
                        subscription.id
                    );

                    */


                }

                else {

                    /*
                    Permission denied
                    */

                    status.innerHTML =
                        "❌ Notification permission was not granted.";


                    button.innerHTML =
                        "🔔 Try Again";


                    button.disabled = false;

                }

            }

            catch(error) {

                console.error(
                    "Notification error:",
                    error
                );


                status.innerHTML =
                    "❌ " +
                    escapeHtml(
                        error.message || "Something went wrong."
                    );


                button.innerHTML =
                    "🔔 Try Again";


                button.disabled = false;

            }

        }
    );



    /*
    ==========================================================
        SHOW DEVICE ID
    ==========================================================
    */

    function showDevice(id) {

        currentDeviceId = id;

        deviceBox.style.display =
            "block";

        deviceIdElement.innerText =
            id;

    }



    /*
    ==========================================================
        COPY DEVICE ID
    ==========================================================
    */

    copyButton.addEventListener(
        "click",
        async function() {

            if (!currentDeviceId) {
                return;
            }


            try {

                await navigator.clipboard
                    .writeText(currentDeviceId);


                copyButton.innerText =
                    "✅ Copied!";


                setTimeout(
                    function() {

                        copyButton.innerText =
                            "📋 Copy Device ID";

                    },
                    1500
                );


            }

            catch(error) {

                console.error(
                    "Copy failed:",
                    error
                );

            }

        }
    );



    /*
    ==========================================================
        HELPER: WAIT
    ==========================================================
    */

    function wait(milliseconds) {

        return new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    milliseconds
                )
        );

    }



    /*
    ==========================================================
        HELPER: ESCAPE HTML
    ==========================================================
    */

    function escapeHtml(value) {

        const div =
            document.createElement("div");

        div.textContent =
            String(value);

        return div.innerHTML;

    }

</script>


</body>
</html>
