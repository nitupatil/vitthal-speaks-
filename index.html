<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enable Notifications</title>

    <!-- OneSignal -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .card {
            width: 90%;
            max-width: 420px;
            padding: 35px;
            text-align: center;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 22px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
        }

        .icon {
            width: 75px;
            height: 75px;
            margin: auto auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: white;
            color: #667eea;
            font-size: 35px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            opacity: .85;
            line-height: 1.6;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: 0;
            border-radius: 12px;
            background: white;
            color: #5b4bc4;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: translateY(-1px);
        }

        #status {
            margin-top: 18px;
            font-size: 14px;
            word-break: break-word;
        }

        #deviceId {
            margin-top: 12px;
            padding: 10px;
            background: rgba(0,0,0,.2);
            border-radius: 8px;
            font-size: 12px;
            display: none;
            word-break: break-all;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">🔔</div>

    <h1>Stay Updated</h1>

    <p>
        Enable notifications to receive important updates
        directly on this device.
    </p>

    <button id="notifyButton">
        🔔 Enable Notifications
    </button>

    <div id="status">
        Notifications are currently disabled.
    </div>

    <div id="deviceId"></div>

</div>


<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];

OneSignalDeferred.push(async function(OneSignal) {

    await OneSignal.init({
        appId: "7171c1c5-1f40-4c60-b965-00ff2d3b2b0f",

        allowLocalhostAsSecureOrigin: true,

        notifyButton: {
            enable: false
        }
    });


    const button = document.getElementById("notifyButton");
    const status = document.getElementById("status");
    const deviceIdBox = document.getElementById("deviceId");


    async function updateDeviceInfo() {

        const optedIn = OneSignal.User.PushSubscription.optedIn;

        const subscriptionId =
            OneSignal.User.PushSubscription.id;


        if (optedIn && subscriptionId) {

            status.innerHTML =
                "✅ Notifications are enabled on this device.";

            deviceIdBox.style.display = "block";

            deviceIdBox.innerHTML =
                "Subscription ID:<br><br>" +
                subscriptionId;

            console.log("OneSignal Subscription ID:", subscriptionId);

            /*
             * SEND THIS ID TO YOUR SERVER / SUPABASE
             *
             * Example:
             *
             * fetch("/save-device", {
             *     method: "POST",
             *     headers: {
             *         "Content-Type": "application/json"
             *     },
             *     body: JSON.stringify({
             *         subscription_id: subscriptionId
             *     })
             * });
             */
        }
    }


    button.addEventListener("click", async function() {

        try {

            status.innerHTML =
                "Requesting notification permission...";

            await OneSignal.User.PushSubscription.optIn();

            await updateDeviceInfo();

        } catch (error) {

            console.error(error);

            status.innerHTML =
                "❌ Notification permission was not granted.";

        }

    });


    /*
     * Check existing permission
     */
    await updateDeviceInfo();

});
</script>

</body>
</html>
